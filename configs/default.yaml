# FakeLens default configuration.
# Paths are for Kaggle Notebooks with these datasets attached (Add Data -> search "GenImage vtphatt2"):
#   vtphatt2/GenImage-stable-diffusion-v1-4   -> training source
#   vtphatt2/GenImage-Validation              -> test source (val split of all 8 generators)
# The manifest stores paths RELATIVE to these roots, so the committed manifest works on any machine
# once the roots below point to the right folders.

roots:
  train_root: /kaggle/input/datasets/vtphatt2/genimage-stable-diffusion-v1-4
  test_root: /kaggle/input/datasets/vtphatt2/genimage-validation
  wild_root: /kaggle/input/fakelens-wild        # optional: folder with real/ and fake/ subfolders

paths:
  manifest: data/manifests/manifest.csv
  features: /kaggle/working/features            # cached backbone features (large, not committed)
  runs: /kaggle/working/runs                    # checkpoints + predictions
  results: results                              # metrics tables + figures (committed)

seed: 42
seeds: [0, 1, 2]                                # repeated runs for mean +- std

data:
  n_train_per_class: 5000                       # SD v1.4 train/ -> train split
  n_val_per_class: 500                          # SD v1.4 train/ (disjoint files) -> val split
  n_test_per_class: 500                         # per generator, from val/ of the Validation subset
  n_logo_per_class: 1000                        # per generator, extra pool for leave-one-generator-out
  oversample: 1.15                              # sample extra candidates so dedupe never leaves us short
  generators: [sdv14, sdv15, midjourney, adm, glide, wukong, vqdm, biggan]
  groups:
    in_dist: [sdv14]
    near_dist: [sdv15]
    unseen: [midjourney, adm, glide, wukong, vqdm, biggan]

preprocess:
  debias_jpeg_quality: 96                       # re-encode BOTH classes -> removes JPEG-vs-PNG shortcut; null = raw
  crop: 224                                     # crop without resizing (keeps high-frequency traces)
  min_side_resize: true                         # images smaller than crop (e.g. BigGAN 128px) are upscaled first

augment:                                        # CNNDetection-style train augmentation (ResNet + CLIP train views)
  hflip: 0.5
  blur_prob: 0.1
  blur_sigma: [0.1, 3.0]
  jpeg_prob: 0.1
  jpeg_quality: [30, 100]

features:
  train_aug_views: 1                            # extra augmented views per train image (view 0 is always clean)
  batch_size: 64
  num_workers: 4

heads:
  linear:                                       # A1: final CLIP embedding -> logistic regression
    input: embed
    lr: 1.0e-3
    weight_decay: 1.0e-4
    epochs: 60
  multilayer:                                   # A2-A4: CLS from every block, learnable layer weights -> MLP
    input: cls
    hidden: 512
    dropout: 0.5
    lr: 1.0e-3
    weight_decay: 1.0e-2
    epochs: 60
  batch_size: 256
  patience: 8

resnet:
  lr: 1.0e-4
  weight_decay: 1.0e-4
  epochs: 15
  warmup_epochs: 1
  batch_size: 64
  num_workers: 4
  patience: 4

experiments:
  data_efficiency_sizes: [100, 500, 1000, 2500, 5000, 10000]   # total train images (balanced)
  fewshot_k: [0, 16, 64, 256]                                    # images from the unseen generator added to train
  bootstrap: 1000

robustness:
  n_per_class: 200                              # per generator
  conditions:                                   # name: list of severities (exact params logged to results/)
    clean: [null]
    jpeg: [95, 85, 75, 65, 50, 30]
    resize: [0.5, 0.75, 1.25, 1.5]
    lowres: [112, 64]                           # GenImage Table 5
    blur: [1.0, 3.0, 5.0]                       # GenImage Table 5 uses 3 and 5
    noise: [0.01, 0.03, 0.05]                   # gaussian std on [0,1] pixels
    social: [null]                              # long side -> 1080 then JPEG 80
