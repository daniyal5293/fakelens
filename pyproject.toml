[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fakelens"
version = "0.1.0"
description = "Generalizable AI-generated image detection with frozen CLIP features (course project)"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
  "torch>=2.1",
  "torchvision>=0.16",
  "open_clip_torch>=2.24",
  "numpy",
  "pandas",
  "scikit-learn",
  "scipy",
  "pillow",
  "pyyaml",
  "matplotlib",
  "tqdm",
]

[project.optional-dependencies]
demo = ["gradio>=4"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
